</style></head><body>

const wrapScene = (i, html) => {
  const [a1, a2] = ACC[i];
  const bg = `<div class="hbg" style="background:${BG[i]}"><span class="b" style="width:280px;height:280px;right:-120px;top:-100px;background:${a1}"></span><span class="b" style="width:200px;height:200px;left:-90px;top:600px;background:${a2};animation-delay:.25s"></span><span class="t" style="width:80px;height:80px;right:26px;top:660px;background:#fff"></span>${EMO.map((e,k)=>`<span class="flt" style="left:${20+k*66}px;animation-delay:${-(k*0.43)}s;animation-duration:${2.6+(k%3)*0.5}s">${e}</span>`).join('')}</div>`;
  const st = STK[i] ? `<span class="stk" style="left:${STK[i][1]}px;top:${STK[i][2]}px;--r:${STK[i][3]};animation-delay:${STKAT[i]}s">${STK[i][0]}</span>` : '';
  return bg + html.replace(/<div class="cap"([^>]*)>([\s\S]*?)<\/div>$/, '<div class="cap"$1><span class="box">$2</span></div>') + st;
};
const root = document.getElementById('scenes');
let t = 0; const starts = [];
S.forEach((html, i) => { const el = document.createElement('div'); el.className = 'scene'; el.innerHTML = wrapScene(i, html); el.dataset.i = i; root.appendChild(el); starts.push(t); t += D[i] + PAD; });
window.TOTAL = t; window.STARTS = starts;
// fades between scenes
window.seek = (time) => {
  const scenes = [...document.querySelectorAll('.scene')];
  scenes.forEach((el, i) => {
    const s = starts[i], e = s + D[i] + PAD;
    let o = 0;
    if (time >= s && time < e) o = Math.min(1, (time - s) / 0.25, (e - time) / 0.25);
    el.style.opacity = o;
    el.style.display = o > 0 ? 'block' : 'none';
  });
  document.body.offsetHeight;
  for (const a of document.getAnimations()) {
    const sc = a.effect?.target?.closest?.('.scene');
    if (!sc) continue;
    a.currentTime = Math.max(0, (time - starts[+sc.dataset.i]) * 1000);
  }
};
</script></body></html>
